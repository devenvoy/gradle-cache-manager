<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gradle Cache Manager</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>

<div class="app-layout">

    <!-- Left Sidebar -->
    <aside class="sidebar">
        <div class="sidebar-header">
            <div class="brand">
                <svg xmlns="http://www.w3.org/2000/svg" width="26" height="26"
                     viewBox="0 0 24 24" fill="none" stroke="currentColor"
                     stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/>
                    <polyline points="3.29 7 12 12 20.71 7"/>
                    <line x1="12" y1="22" x2="12" y2="12"/>
                </svg>
                <div>
                    <h1 class="brand-title">Gradle Cache</h1>
                    <span class="brand-subtitle">Manager Hub</span>
                </div>
            </div>
        </div>

        <nav class="sidebar-nav">
            <div class="nav-category">WORKSPACE</div>
            <button class="nav-item tab-btn" data-tab="distributions" onclick="App.switchTab('distributions')" id="tabDist"></button>
            <button class="nav-item tab-btn" data-tab="alignment" onclick="App.switchTab('alignment')" id="tabAlign"></button>
            <button class="nav-item tab-btn" data-tab="libraries" onclick="App.switchTab('libraries')" id="tabLib"></button>

            <div class="nav-category">CACHE & STORAGE</div>
            <button class="nav-item tab-btn" data-tab="caches" onclick="App.switchTab('caches')" id="tabCache"></button>
            <button class="nav-item tab-btn" data-tab="daemons" onclick="App.switchTab('daemons')" id="tabDaemon"></button>
            <button class="nav-item tab-btn" data-tab="konan" onclick="App.switchTab('konan')" id="tabKonan"></button>

            <div class="nav-category">CONFIG</div>
            <button class="nav-item tab-btn" data-tab="properties" onclick="App.switchTab('properties')" id="tabProps"></button>
        </nav>

        <div class="sidebar-footer">
            <div class="sidebar-actions">
                <button class="btn btn--primary btn--sm btn--block" onclick="App.refreshAll()" id="refreshBtn"></button>
                <button class="btn btn--ghost btn--sm btn--block" onclick="App.stopDaemons()" id="stopBtn"></button>
            </div>
            <div class="server-status">
                <span class="status-indicator"></span>
                <span>localhost:8484 &middot; Active</span>
            </div>
        </div>
    </aside>

    <!-- Main Content Area -->
    <main class="main-content">
        <!-- Overview Cards -->
        <div class="overview-grid" id="overview"></div>

        <!-- Tab Content -->
        <section id="tabContent">
            <div class="loading-state"><div class="spinner"></div>Scanning Gradle home&hellip;</div>
        </section>
    </main>

</div>

<!-- Delete Confirmation Modal -->
<div class="modal-backdrop" id="modalBackdrop"></div>

<!-- Snippet Modal (Wrapper Config / Library Dependency) -->
<div class="modal-backdrop" id="snippetBackdrop"></div>

<!-- Toast Notification -->
<div class="toast" id="toast"></div>

<!-- Scripts (order matters: icons → components → app) -->
<script src="/static/icons.js"></script>
<script src="/static/components.js"></script>
<script src="/static/app.js"></script>

<!-- Inject icon-dependent button labels after icons.js loads -->
<script>
    document.getElementById("refreshBtn").innerHTML = Icons.refresh(14) + " Refresh";
    document.getElementById("stopBtn").innerHTML    = Icons.square(14)  + " Stop Daemons";
    document.getElementById("tabDist").innerHTML    = Icons.package(16) + " Distributions";
    document.getElementById("tabAlign").innerHTML   = Icons.gitBranch(16) + " Projects & Alignment";
    document.getElementById("tabLib").innerHTML     = Icons.library(16) + " Libraries";
    document.getElementById("tabCache").innerHTML   = Icons.database(16) + " Caches";
    document.getElementById("tabDaemon").innerHTML  = Icons.activity(16) + " Daemons";
    document.getElementById("tabKonan").innerHTML   = Icons.wrench(16) + " Kotlin/Native";
    document.getElementById("tabProps").innerHTML   = Icons.sliders(16) + " Properties";
</script>

</body>
</html>
